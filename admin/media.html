<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Media Library | Admin | Realtor Shamraiz</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>html:not(.auth-ok) body{visibility:hidden}</style>
<script src="js/admin-config.js"></script>
<script src="js/admin-auth.js"></script>
<script>AdminAuth.requireAuth().then(function (ok) { if (ok) document.documentElement.classList.add("auth-ok"); });</script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:0.8rem">
        <button type="button" id="admin-menu-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <h1>Media Library</h1>
          <p class="admin-topbar-meta" id="media-count-meta"></p>
        </div>
      </div>
      <div class="admin-topbar-actions">
        <span class="admin-user-chip" id="admin-current-user"></span>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab is-active" data-kind="image">Images</button>
        <button class="admin-tab" data-kind="video">Videos</button>
        <button class="admin-tab" data-kind="document">Documents / Floor Plans / Brochures</button>
      </div>
      <section class="admin-card">
        <div id="media-grid" class="admin-thumb-grid"></div>
        <div id="media-empty"></div>
      </section>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/listings-data.js"></script>
<script src="js/admin-db.js"></script>
<script src="js/admin-store.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/media-page.js"></script>
</body>
</html>
